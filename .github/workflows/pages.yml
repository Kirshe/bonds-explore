name: Update bond data and publish Pages

on:
  push:
    branches: [main, master]
  schedule:
    # Daily at 00:17 UTC (05:47 IST).
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      scrape:
        description: Collect sources before publishing (disable to rebuild retained data)
        type: boolean
        default: true

permissions:
  contents: read

# Serialise the whole restore/collect/persist/deploy cycle to avoid lost state.
concurrency:
  group: bondscope-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install optional legacy XLS reader
        run: python -m pip install -r requirements-excel.txt
      - name: Verify application
        run: |
          python -m unittest discover -s tests -v
          node --check web/app.js
          node tests/dashboard.test.cjs
      - name: Restore last-good source state
        run: |
          bash scripts/pages-state.sh restore \
            "$RUNNER_TEMP/bondscope-state-worktree" \
            "$RUNNER_TEMP/bondscope-prior-state.json"
      - name: Collect sources and build static dashboard
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUEST_SCRAPE: ${{ inputs.scrape }}
        run: |
          args=(--db "$RUNNER_TEMP/bondscope.sqlite3" build --output dist
            --state-output "$RUNNER_TEMP/bondscope-new-state.json")
          if [[ -f "$RUNNER_TEMP/bondscope-prior-state.json" ]]; then
            args+=(--restore-state "$RUNNER_TEMP/bondscope-prior-state.json")
          fi
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REQUEST_SCRAPE" == true ]]; then
            args+=(--scrape)
          fi
          # A valid retained-data site is published even when a provider fails.
          # Parser/state/build errors remain fatal and preserve the deployed site.
          python -m bondscope "${args[@]}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          market = json.loads(Path('dist/market.json').read_text())
          failures = [s for s in market['sources'] if s['status'] == 'error']
          if failures:
              print('::warning::One or more bond sources failed; retained data and errors will be published.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Built {len(market['bonds'])} observations.\n\n")
              summary.write('| Source | Records | Collection mode | Status |\n|---|---:|---|---|\n')
              for source in market['sources']:
                  summary.write(f"| {source['name']} | {source['count']} | {source['mode']} | {source['status']} |\n")
          PY
      - name: Persist latest source state
        run: |
          bash scripts/pages-state.sh save \
            "$RUNNER_TEMP/bondscope-state-worktree" \
            "$RUNNER_TEMP/bondscope-new-state.json"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
