<!doctype html>
<html lang="en" data-mode="live">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#143c30">
  <meta name="description" content="Search and compare Indian bonds by issuer, yield, rating and maturity.">
  <title>BondScope — Bond explorer</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
  <link rel="stylesheet" href="./styles.css?v=2">
  <script src="./app.js?v=2" defer></script>
</head>
<body>
  <a class="skip" href="#explorer">Skip to bond table</a>
  <header class="topbar">
    <a class="brand" href="./" aria-label="BondScope home"><img src="./favicon.svg" alt="" width="34" height="34">BondScope<span class="country">INDIA</span></a>
  </header>

  <main>
    <section id="explorer" class="explorer" aria-labelledby="explorer-title">
      <div class="section-title">
        <h1 id="explorer-title">Bond explorer</h1>
        <div class="actions">
          <button class="button secondary" id="refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-2L20 8M4 16l2.3 3A7 7 0 0 0 18 17"/></svg><span>Refresh listings</span></button>
          <button id="export" class="button secondary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg>Export CSV</button>
        </div>
      </div>
      <div id="feedback" class="feedback" role="status" hidden></div>
      <div class="tabs" role="group" aria-label="Filter by bond type" id="category-tabs"><button class="tab selected" data-category="" aria-pressed="true">All bonds</button><button class="tab" data-category="State government" aria-pressed="false">State govt</button><button class="tab" data-category="Central government" aria-pressed="false">Central govt</button><button class="tab" data-category="Treasury bill" aria-pressed="false">T-bills</button><button class="tab" data-category="Corporate / NBFC" aria-pressed="false">Corporate / NBFC</button><button class="tab" data-category="PSU" aria-pressed="false">PSU</button><button class="tab" data-category="Tax-free" aria-pressed="false">Tax-free</button><button class="tab" data-category="Sovereign gold" aria-pressed="false">Sovereign gold</button></div>
      <div class="filter-bar">
        <label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="Search issuer or ISIN…" aria-label="Search issuer or ISIN"><kbd>/</kbd></label>
        <label class="select-label"><span class="sr-only">Quoted yield</span><select id="yield-filter"><option value="">All yields</option><option value="under7">Under 7%</option><option value="7to9">7% – 9%</option><option value="over9">Above 9%</option></select></label>
        <label class="select-label"><span class="sr-only">Interest payout</span><select id="payout-filter"><option value="">All payouts</option><option value="Monthly">Monthly</option><option value="Quarterly">Quarterly</option><option value="Semi Annual">Semi annual</option><option value="Annual">Annual</option></select></label>
        <label class="select-label"><span class="sr-only">Source</span><select id="source-filter"><option value="">All sources</option></select></label><label class="select-label"><span class="sr-only">Yield basis</span><select id="basis-filter"><option value="">All yield bases</option><option value="quoted">Source-quoted</option><option value="traded_ytm">Last traded YTM</option><option value="weighted_ytm">Weighted traded YTM</option><option value="indicative">Indicative at face value</option><option value="reference">Reference data</option></select></label><label class="select-label"><span class="sr-only">Instrument status</span><select id="status-filter"><option value="active">Hide matured / redeemed</option><option value="all">Include matured / redeemed</option><option value="defaulted">Redemption defaults</option></select></label><button class="reset" id="reset">Reset filters</button>
      </div>
      <div class="table-wrap" tabindex="0" role="region" aria-label="Bond listings; scroll horizontally on smaller screens">
        <table><caption class="sr-only">Public Indian bond listings. Select a column heading to sort or a bond to see details.</caption><thead><tr><th scope="col" aria-sort="ascending"><button data-sort="issuer">Bond / issuer <span>↑</span></button></th><th scope="col"><button data-sort="category">Type <span>↕</span></button></th><th scope="col"><button data-sort="yield_pct">Yield / basis <span>↕</span></button></th><th scope="col"><button data-sort="coupon_pct">Coupon <span>↕</span></button></th><th scope="col"><button data-sort="rating">Rating <span>↕</span></button></th><th scope="col"><button data-sort="maturity_date">Maturity / source tenure <span>↕</span></button></th><th scope="col"><button data-sort="payout">Payout <span>↕</span></button></th><th scope="col"><span class="sr-only">Details</span></th></tr></thead><tbody id="bond-rows"><tr><td colspan="8" class="empty">Loading bond listings…</td></tr></tbody></table>
      </div>
      <div class="table-footer"><p id="results-count" aria-live="polite">Loading…</p><div class="pagination"><button id="prev" aria-label="Previous page">←</button><span id="page-label">Page 1 of 1</span><button id="next" aria-label="Next page">→</button></div></div>
    </section>
  </main>
  <footer><p>For research. Verify terms and availability with the original source.</p><p id="publication-note" hidden></p></footer>

  <dialog id="detail-dialog" aria-labelledby="detail-title"><div class="dialog-heading"><p class="eyebrow">BOND DETAILS</p><button class="close-dialog" aria-label="Close bond details">×</button></div><h2 id="detail-title"></h2><div id="detail-body"></div></dialog>
</body>
</html>
